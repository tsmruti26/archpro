spring.application.name=ai-project-log-backend
server.port=${PORT:8080}

# --- Database ---
# Defaults to a file-based H2 DB so it runs with zero setup.
# Point these at Postgres in production by setting env vars, e.g.:
#   DB_URL=jdbc:postgresql://localhost:5432/ai_project_log
#   DB_USER=postgres
#   DB_PASSWORD=secret
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ai-project-log;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console at /h2-console — dev convenience only, disable in production
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# --- Anthropic (for project summary generation) ---
# Set your own key as an env var; never commit a real key here.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-4-6
anthropic.base-url=https://api.anthropic.com

# --- CORS ---
# Chrome extension origins look like chrome-extension://<id>. Add your
# extension's actual ID here once it's loaded (see chrome://extensions),
# or leave the wildcard for local development.
app.cors.allowed-origins=${CORS_ORIGINS:*}
