<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ArchPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="project.css" />
</head>
<body>
  <div class="page">
    <a href="dashboard.html" class="back-link">← All projects</a>

    <header class="project-head">
      <div class="head-top">
        <span class="source-tab" id="source-tab"></span>
        <h1 id="project-name" contenteditable="false"></h1>
      </div>
      <div class="head-actions">
        <button id="rename-btn" class="btn-ghost">Rename</button>
        <button id="archive-btn" class="btn-ghost">Archive</button>
        <button id="delete-btn" class="btn-danger">Delete</button>
      </div>
    </header>

    <section id="summary-panel" class="summary-panel">
      <div class="summary-head">
        <h2>Project summary</h2>
        <button id="generate-summary-btn" class="btn-ghost small">Generate</button>
      </div>
      <div id="summary-body" class="summary-body empty">No summary yet — generate one from the checkpoint log.</div>
    </section>

    <section class="add-checkpoint">
      <textarea id="new-note" rows="2" placeholder="What did you just do, or where are you leaving off?"></textarea>
      <div class="add-row">
        <input type="text" id="new-link" placeholder="Chat link (optional)" />
        <button id="add-checkpoint-btn" class="btn-primary">Add checkpoint</button>
      </div>
    </section>

    <section id="timeline" class="timeline"></section>
    <div id="timeline-empty" class="empty-state" hidden>
      <p>No checkpoints yet. Add your first one above.</p>
    </div>
  </div>

  <dialog id="delete-dialog" class="confirm-dialog">
    <p class="dialog-title">Delete this project?</p>
    <p class="dialog-body">This removes <strong id="delete-target-name"></strong> and all of its checkpoints. This can't be undone.</p>
    <div class="dialog-actions">
      <button id="delete-cancel" class="btn-ghost">Cancel</button>
      <button id="delete-confirm" class="btn-danger">Delete permanently</button>
    </div>
  </dialog>

  <div class="build-stamp">build 2.2.0</div>

  <script src="storage.js"></script>
  <script src="project.js"></script>
</body>
</html>
